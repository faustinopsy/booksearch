<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Descubra livros e leia resenhas geradas por IA. Powered by Google Books e Gemini.">
  <title>BookSearch</title>
  <script type="module" crossorigin src="/booksearch/assets/index-CMc8Bc3T.js"></script>
  <link rel="stylesheet" crossorigin href="/booksearch/assets/index-DzgximCv.css">
</head>
<body>

  <header class="bs-header">
    <h1 class="bs-logo">📚 BookSearch</h1>
    <div class="bs-busca">
      <input
        id="inputBusca"
        type="search"
        placeholder="Título, autor ou assunto..."
        autocomplete="off"
        aria-label="Campo de busca de livros"
      >
      <button id="btnBuscar" class="btn-buscar" aria-label="Buscar livros">Buscar</button>
      <button id="btnTema" title="Alternar tema claro/escuro" aria-label="Alternar tema">🌙</button>
    </div>
    <div id="historicoContainer" class="historico-container" aria-label="Histórico de buscas" role="list"></div>
  </header>

  <nav class="bs-nav" id="bsNav" aria-label="Navegação principal">
    <a href="#/inicio"    class="nav-link">Início</a>
    <a href="#/favoritos" class="nav-link">Favoritos</a>
    <a href="#/sobre"     class="nav-link">Sobre</a>
  </nav>

  <main id="app">
    <div id="erro" class="hidden" role="alert"></div>
    <div id="selectWrapper" class="select-wrapper hidden">
      <select id="selectCat"   aria-label="Filtrar por categoria">
        <option value="">Todas as categorias</option>
      </select>
      <select id="selectOrdem" aria-label="Ordenar resultados">
        <option value="relevance">Relevância</option>
        <option value="newest">Mais recentes</option>
      </select>
    </div>
    <section id="grade-livros" aria-label="Resultados da busca"></section>
    <div id="paginacao" class="paginacao" role="navigation" aria-label="Paginação"></div>
    <aside id="detalhe-livro" class="hidden" aria-modal="true"></aside>
  </main>

</body>
</html>
